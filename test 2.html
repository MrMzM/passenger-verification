<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Passenger Verification</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #eef5fa;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 430px;
    max-width: 100%;
    background: white;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.12);
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #0878c9;
}

.subtitle {
    margin-top: 5px;
    font-size: 11px;
    color: #777;
    letter-spacing: 1.5px;
}

h2 {
    margin-top: 30px;
    color: #172b4d;
    font-size: 25px;
}

.instruction {
    margin-top: 12px;
    color: #666;
    font-size: 14px;
    line-height: 1.5;
}

.qr-container {
    width: 290px;
    height: 290px;
    margin: 25px auto;
    padding: 20px;
    background: white;
    border-radius: 18px;
    border: 2px solid #e1e8ef;

    display: flex;
    align-items: center;
    justify-content: center;
}

#qrcode {
    display: flex;
    justify-content: center;
    align-items: center;
}

.scan-text {
    color: #0878c9;
    font-size: 18px;
    font-weight: bold;
}

.small-text {
    color: #777;
    font-size: 12px;
    margin-top: 10px;
}

.footer {
    margin-top: 25px;
    color: #aaa;
    font-size: 9px;
    letter-spacing: .5px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        AVIATION VERIFY
    </div>

    <div class="subtitle">
        PASSENGER VERIFICATION DEMO
    </div>

    <h2>
        Passenger Verification
    </h2>

    <p class="instruction">
        Please scan the QR code below using
        your mobile phone to verify your
        passenger credentials.
    </p>

    <div class="qr-container">
        <div id="qrcode"></div>
    </div>

    <div class="scan-text">
        📱 Scan QR to Verify
    </div>

    <p class="small-text">
        Scan the QR code to complete
        passenger verification.
    </p>

    <div class="footer">
        DEMONSTRATION SYSTEM • NOT AN OFFICIAL GOVERNMENT SERVICE
    </div>

</div>

<script>

/*
========================================
GITHUB PAGES INFORMATION
========================================

GitHub username:
MrMzM

Repository:
passenger-verification

Website:
https://mrmzm.github.io/passenger-verification/

========================================
*/


const githubUsername = "MrMzM";


/*
Create a random demo verification ID
*/

const verificationID =
    "AV-" +
    Math.floor(100000 + Math.random() * 900000);


/*
Create the PUBLIC verification URL.

There is NO PC IP address here.
There is NO localhost.
*/

const verificationURL =
    "https://" +
    githubUsername.toLowerCase() +
    ".github.io/passenger-verification/verify.html?id=" +
    verificationID;


/*
Generate QR code
*/

new QRCode(
    document.getElementById("qrcode"),
    {
        text: verificationURL,

        width: 245,

        height: 245,

        colorDark: "#000000",

        colorLight: "#ffffff",

        correctLevel: QRCode.CorrectLevel.H
    }
);

</script>

</body>
</html>
